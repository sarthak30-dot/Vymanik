name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref so rapid pushes don't queue up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Production deploys are handled by Vercel's own Git integration (it builds and
# deploys every push to main automatically). The old "Deploy → Vercel" job here
# was a redundant second deploy path and kept failing, so it was removed. This
# workflow is now just a build check.
jobs:
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Advisory only: the repo predates a repo-wide Prettier pass, so eslint
      # reports formatting diffs that shouldn't fail the run (and shouldn't
      # email on every push). Annotations still show in the run for reference.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # The real gate: a broken build fails the run.
      - name: Build
        run: npm run build
